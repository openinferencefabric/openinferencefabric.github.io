name: upstream status
# Refresh upstream/status.json: the state of every upstream thread in upstream/contributions.json, plus new ones found
# on GitHub. Commits only when something changed.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [upstream/contributions.json, scripts/upstream_status.py]

permissions:
  contents: write

concurrency:
  group: upstream-status
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/upstream_status.py
      - name: Commit if changed
        run: |
          git diff --quiet upstream/status.json && { echo "no change"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add upstream/status.json
          git commit -m "upstream: refresh status"
          git push
